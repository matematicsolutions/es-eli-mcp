# Runtime of the Claude plugin: pins es-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uvx es-eli-mcp==0.5.3 (Claude Code's locked launch reads this uv.lock)
[project]
name = "es-eli-mcp-plugin-runtime"
version = "0.5.3"
requires-python = ">=3.11,<3.14"
dependencies = ["es-eli-mcp==0.5.3"]

[tool.uv]
package = false
